<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Diecast Radar UK</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --primary: #10b981;
            --primary-glow: rgba(16, 185, 129, 0.4);
            --bounty-red: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-bottom: 80px;
        }

        /* Header & Navigation */
        header {
            background-color: var(--panel-bg);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--primary);
            box-shadow: 0 4px 15px var(--primary-glow);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo { font-weight: 800; font-size: 1.2rem; color: var(--primary); letter-spacing: 1px; }
        
        .header-buttons {
            display: flex;
            gap: 10px;
        }

        .btn-small {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            font-weight: bold;
        }

        /* Bounty Board */
        .bounty-board {
            background: linear-gradient(145deg, #2a1010, #1a0808);
            border: 1px solid var(--bounty-red);
            margin: 15px;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.2);
            position: relative;
            overflow: hidden;
        }
        
        .bounty-board::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: repeating-radial-gradient(circle, transparent, transparent 20px, rgba(239, 68, 68, 0.05) 21px, rgba(239, 68, 68, 0.05) 22px);
            animation: radar 10s linear infinite;
            pointer-events: none;
        }

        @keyframes radar { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .bounty-title { color: var(--bounty-red); font-size: 0.8rem; font-weight: 900; letter-spacing: 2px; margin-bottom: 5px; }
        .bounty-car { font-size: 1.2rem; font-weight: bold; color: white; }

        /* Feed */
        .feed-container { padding: 0 15px; display: flex; flex-direction: column; gap: 15px; }
        
        .post-card {
            background: var(--panel-bg);
            border-radius: 10px;
            padding: 15px;
            border-left: 4px solid var(--primary);
        }

        .post-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
        
        .user-info { display: flex; flex-direction: column; gap: 2px; }
        .username-row { display: flex; align-items: center; gap: 6px; }
        .username { font-weight: bold; color: var(--primary); }
        .streak { font-size: 0.8rem; color: #f97316; background: rgba(249, 115, 22, 0.15); padding: 2px 6px; border-radius: 12px; font-weight: bold; }
        
        .top-iso-badge {
            font-size: 0.75rem;
            color: #cbd5e1;
            display: flex;
            align-items: center;
            gap: 4px;
            margin-top: 2px;
        }
        
        .time { font-size: 0.75rem; color: var(--text-muted); }
        .post-location { font-weight: bold; font-size: 1.1rem; margin-bottom: 5px; }
        .post-car { color: #e2e8f0; margin-bottom: 5px; }
        .post-intel { font-size: 0.9rem; color: var(--text-muted); font-style: italic; }

        /* Floating Action Button */
        .fab {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--primary);
            color: #000;
            border: none;
            padding: 15px 30px;
            border-radius: 30px;
            font-weight: 900;
            font-size: 1rem;
            box-shadow: 0 4px 15px var(--primary-glow);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 90;
        }

        /* Modals */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: none; justify-content: center; align-items: center;
            z-index: 200; padding: 20px;
        }

        .modal {
            background: var(--panel-bg);
            width: 100%; max-width: 400px;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .modal h2 { margin-bottom: 15px; color: white; font-size: 1.2rem; }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 5px; }
        .form-group input, .form-group select {
            width: 100%; padding: 10px; border-radius: 6px;
            background: #0f172a; border: 1px solid rgba(255,255,255,0.2);
            color: white; font-size: 1rem;
        }

        .iso-slot-1 input { border-color: var(--primary); box-shadow: 0 0 8px rgba(16, 185, 129, 0.2); }
        .iso-label-1 { color: var(--primary) !important; font-weight: bold; }

        .btn-submit {
            width: 100%; background: var(--primary); color: #000;
            border: none; padding: 12px; border-radius: 6px;
            font-weight: bold; font-size: 1rem; cursor: pointer; margin-top: 10px;
        }
        
        .btn-cancel {
            width: 100%; background: transparent; color: var(--text-muted);
            border: none; padding: 12px; margin-top: 5px; cursor: pointer;
        }

    </style>
</head>
<body>

    <header>
        <div class="logo">📡 DIECAST RADAR UK</div>
        <div class="header-buttons">
            <button class="btn-small" onclick="openGarage()">Garage</button>
            <button class="btn-small" onclick="setupProfile()">Profile</button>
        </div>
    </header>

    <div class="bounty-board">
        <div class="bounty-title">🔴 NATIONWIDE BOUNTY 🔴</div>
        <div class="bounty-car" id="bounty-target">Boulevard Nissan Skyline R34</div>
    </div>

    <div class="feed-container" id="feed">
        <!-- Posts will load here -->
    </div>

    <button class="fab" onclick="openTransmit()">
        <span>📡</span> TRANSMIT INTEL
    </button>

    <!-- Transmit Modal -->
    <div class="modal-overlay" id="transmit-modal">
        <div class="modal">
            <h2>Transmit Intel</h2>
            <div class="form-group">
                <label>Store & Location</label>
                <input type="text" id="post-location" placeholder="e.g. Smyths, Manchester" required>
            </div>
            <div class="form-group">
                <label>Car or Series Found</label>
                <input type="text" id="post-car" placeholder="e.g. Full restock of Neon Speeders" required>
            </div>
            <div class="form-group">
                <label>Extra Intel (Optional)</label>
                <input type="text" id="post-intel" placeholder="e.g. Only 2 left on the front pegs">
            </div>
            <button class="btn-submit" onclick="submitPost()">TRANSMIT</button>
            <button class="btn-cancel" onclick="closeModal('transmit-modal')">Cancel</button>
        </div>
    </div>

    <!-- Garage Modal -->
    <div class="modal-overlay" id="garage-modal">
        <div class="modal">
            <h2>My Garage (ISO List)</h2>
            <p style="font-size: 0.8rem; color: #94a3b8; margin-bottom: 15px;">List your top 5 most wanted cars. Slot #1 will be shown under your name on all your posts!</p>
            
            <div class="form-group iso-slot-1">
                <label class="iso-label-1">1. Top Grail (Visible on Feed)</label>
                <input type="text" id="iso-1" placeholder="e.g. STH Datsun 510">
            </div>
            <div class="form-group">
                <label>2. Wanted Car</label>
                <input type="text" id="iso-2" placeholder="e.g. Team Transport Porsche">
            </div>
            <div class="form-group">
                <label>3. Wanted Car</label>
                <input type="text" id="iso-3" placeholder="">
            </div>
            <div class="form-group">
                <label>4. Wanted Car</label>
                <input type="text" id="iso-4" placeholder="">
            </div>
            <div class="form-group">
                <label>5. Wanted Car</label>
                <input type="text" id="iso-5" placeholder="">
            </div>
            <button class="btn-submit" onclick="saveGarage()">SAVE GARAGE</button>
            <button class="btn-cancel" onclick="closeModal('garage-modal')">Cancel</button>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // ==========================================
        // PASTE YOUR FIREBASE CONFIG HERE
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyD_4xmL3EHphSGww2W7lg2kl2-iEzpNcgg",
  authDomain: "diecast-radar-5c38d.firebaseapp.com",
  projectId: "diecast-radar-5c38d",
  storageBucket: "diecast-radar-5c38d.firebasestorage.app",
  messagingSenderId: "918192680035",
  appId: "1:918192680035:web:d11555276d973b993b5c56",
  measurementId: "G-T05Y2L42L5"
        };

        // If config is empty, we will use mock data for demonstration
        let db;
        let postsRef;
        const isFirebaseConfigured = !!firebaseConfig.apiKey;

        if (isFirebaseConfigured) {
            const app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            postsRef = collection(db, "intel_posts");
            
            // Listen for live posts
            const q = query(postsRef, orderBy("timestamp", "desc"));
            onSnapshot(q, (snapshot) => {
                document.getElementById('feed').innerHTML = '';
                snapshot.forEach((doc) => {
                    renderPost(doc.data());
                });
            });
        } else {
            // Mock Data if Firebase isn't hooked up yet
            setTimeout(() => {
                renderPost({
                    username: "DiecastDave",
                    streak: 4,
                    topISO: "STH 56 Chevy",
                    location: "Smyths, Liverpool",
                    car: "Boulevard Restock! No Skylines left though.",
                    intel: "Checked behind the main display, completely cleared out.",
                    timestamp: new Date()
                });
                renderPost({
                    username: "HunterUK",
                    streak: 1,
                    topISO: "Any Mainline Porsches",
                    location: "Asda, Trafford",
                    car: "Fresh Mainline Dump Bin",
                    intel: "Lots of fantasy castings, found a few licensed Japanese cars.",
                    timestamp: new Date(Date.now() - 3600000)
                });
            }, 500);
        }

        // Global functions for HTML buttons
        window.openTransmit = () => {
            if (!localStorage.getItem('radar_username')) {
                setupProfile();
                return;
            }
            document.getElementById('transmit-modal').style.display = 'flex';
        };

        window.closeModal = (id) => {
            document.getElementById(id).style.display = 'none';
        };

        window.setupProfile = () => {
            const currentName = localStorage.getItem('radar_username') || '';
            const newName = prompt("Enter your Hunter Callsign (Username):", currentName);
            if (newName) {
                localStorage.setItem('radar_username', newName);
                alert("Profile updated! You can now transmit intel.");
            }
        };

        window.openGarage = () => {
            const garage = JSON.parse(localStorage.getItem('radar_garage')) || ["", "", "", "", ""];
            document.getElementById('iso-1').value = garage[0];
            document.getElementById('iso-2').value = garage[1];
            document.getElementById('iso-3').value = garage[2];
            document.getElementById('iso-4').value = garage[3];
            document.getElementById('iso-5').value = garage[4];
            document.getElementById('garage-modal').style.display = 'flex';
        };

        window.saveGarage = () => {
            const garage = [
                document.getElementById('iso-1').value,
                document.getElementById('iso-2').value,
                document.getElementById('iso-3').value,
                document.getElementById('iso-4').value,
                document.getElementById('iso-5').value
            ];
            localStorage.setItem('radar_garage', JSON.stringify(garage));
            closeModal('garage-modal');
            alert("Garage saved! Your Top Grail will now appear on your future posts.");
        };

        window.submitPost = async () => {
            const location = document.getElementById('post-location').value;
            const car = document.getElementById('post-car').value;
            const intel = document.getElementById('post-intel').value;
            const username = localStorage.getItem('radar_username');
            
            // Get user's Top ISO from Garage
            const garage = JSON.parse(localStorage.getItem('radar_garage')) || ["", "", "", "", ""];
            const topISO = garage[0] || "";

            if(!location || !car) { alert("Please fill in location and car!"); return; }

            // Calculate Streak
            let streak = parseInt(localStorage.getItem('radar_streak')) || 0;
            let lastPostDate = localStorage.getItem('radar_last_post_date');
            let today = new Date().toDateString();

            if (lastPostDate !== today) {
                let yesterday = new Date();
                yesterday.setDate(yesterday.getDate() - 1);
                if (lastPostDate === yesterday.toDateString()) {
                    streak += 1; // Posted yesterday, streak continues!
                } else {
                    streak = 1; // Missed a day, streak resets.
                }
                localStorage.setItem('radar_streak', streak);
                localStorage.setItem('radar_last_post_date', today);
            }

            const postData = {
                username: username,
                streak: streak,
                topISO: topISO,
                location: location,
                car: car,
                intel: intel,
                timestamp: isFirebaseConfigured ? serverTimestamp() : new Date()
            };

            if (isFirebaseConfigured) {
                try {
                    await addDoc(postsRef, postData);
                    document.getElementById('post-location').value = '';
                    document.getElementById('post-car').value = '';
                    document.getElementById('post-intel').value = '';
                    closeModal('transmit-modal');
                } catch (e) {
                    console.error("Error adding document: ", e);
                    alert("Error saving to database.");
                }
            } else {
                // If no firebase, just render it locally for testing
                renderPost(postData, true);
                closeModal('transmit-modal');
            }
        };

        // Render Function
        function renderPost(data, prepend = false) {
            const feed = document.getElementById('feed');
            const post = document.createElement('div');
            post.className = 'post-card';
            
            // Format Timestamp
            let timeString = "Just now";
            if (data.timestamp && data.timestamp.toDate) {
                timeString = data.timestamp.toDate().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            }

            // Streak HTML
            let streakHTML = data.streak >= 2 ? `<span class="streak">🔥 ${data.streak}</span>` : '';
            
            // Top ISO HTML (The new feature!)
            let topIsoHTML = data.topISO ? `<div class="top-iso-badge">🎯 ISO: ${data.topISO}</div>` : '';

            post.innerHTML = `
                <div class="post-header">
                    <div class="user-info">
                        <div class="username-row">
                            <span class="username">${data.username}</span>
                            ${streakHTML}
                        </div>
                        ${topIsoHTML}
                    </div>
                    <span class="time">${timeString}</span>
                </div>
                <div class="post-location">📍 ${data.location}</div>
                <div class="post-car">🏎️ ${data.car}</div>
                ${data.intel ? `<div class="post-intel">"${data.intel}"</div>` : ''}
            `;

            if (prepend) {
                feed.insertBefore(post, feed.firstChild);
            } else {
                feed.appendChild(post);
            }
        }
    </script>
</body>
</html>
