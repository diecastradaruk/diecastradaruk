    <script>
        // Use LocalStorage to simulate the database so it works immediately for you!
        let currentUser = localStorage.getItem('userId');
        if (!currentUser) {
            currentUser = 'user_' + Math.random().toString(36).substr(2, 9);
            localStorage.setItem('userId', currentUser);
        }

        let profiles = JSON.parse(localStorage.getItem('profiles')) || {};
        let allPosts = JSON.parse(localStorage.getItem('radar_posts')) || [];

        function initApp() {
            document.getElementById('user-display-name').textContent = profiles[currentUser] || "Set Callsign";
            renderFeed();
        }

        // Toggles the custom store input box if they select "Somewhere Else"
        window.toggleCustomStore = (val) => {
            const customInput = document.getElementById('custom-store-name');
            if (val === 'Somewhere Else') {
                customInput.classList.remove('hidden');
                customInput.required = true;
            } else {
                customInput.classList.add('hidden');
                customInput.required = false;
                customInput.value = '';
            }
        };

        function renderFeed() {
            const container = document.getElementById('feed-container');
            const emptyState = document.getElementById('empty-state');
            container.innerHTML = '';
            
            const search = document.getElementById('filter-search').value.toLowerCase();
            
            let filtered = allPosts.filter(post => {
                if (search) {
                    const str = `${post.car || ''} ${post.desc} ${post.store} ${post.location} ${profiles[post.userId] || ''}`.toLowerCase();
                    return str.includes(search);
                }
                return true;
            });

            filtered.sort((a, b) => b.timestamp - a.timestamp);

            if (filtered.length === 0) {
                emptyState.classList.remove('hidden');
                
                const ebayBtn = document.getElementById('ebay-search-btn');
                const emptyText = document.getElementById('empty-state-text');
                
                if (search) {
                    emptyText.textContent = `No local signals found for "${search}".`;
                    ebayBtn.href = `https://www.ebay.co.uk/sch/i.html?_nkw=${encodeURIComponent(search + ' diecast')}`;
                } else {
                    emptyText.textContent = "Be the first to report a store restock in your area!";
                    ebayBtn.href = `https://www.ebay.co.uk/sch/i.html?_nkw=hot+wheels+diecast`;
                }
            } else {
                emptyState.classList.add('hidden');
                filtered.forEach((post, i) => container.appendChild(createPostCard(post, i)));
            }
        }

        function createPostCard(post, index) {
            const author = (post.userId === currentUser) ? 'You' : (profiles[post.userId] || 'Collector');
            const timeAgo = Math.max(1, Math.floor((Date.now() - post.timestamp) / 60000));
            const isRaided = post.emptyVotes >= 3;
            
            let freshnessClass = 'post-fresh';
            if (isRaided) freshnessClass = 'post-raided relative';

            const carName = post.car || 'Hot Wheels';
            const postSearchTerm = encodeURIComponent(`${carName} diecast`);

            const div = document.createElement('div');
            div.className = `glass-card rounded-xl overflow-hidden shadow-md border-l-4 border-l-green-500 bg-slate-900/60 p-4 ${freshnessClass}`;
            
            div.innerHTML = `
                ${isRaided ? '<div class="raided-stamp">RAIDED</div>' : ''}
                <div class="flex gap-3 mb-3">
                    <div class="w-10 h-10 rounded-full bg-slate-800 border border-green-500/50 flex items-center justify-center text-green-400 font-bold text-lg shrink-0">
                        ${author.charAt(0).toUpperCase()}
                    </div>
                    <div class="flex-grow">
                        <div class="flex justify-between">
                            <span class="font-bold text-white text-sm">${author}</span>
                            <span class="text-slate-400 text-xs">${timeAgo}m ago</span>
                        </div>
                        <div class="inline-flex items-center gap-1.5 bg-green-950/40 text-green-300 text-[10px] font-bold uppercase px-2 py-0.5 rounded border border-green-900/50 mt-1 mb-2">
                            <i class="fas fa-map-marker-alt text-green-500"></i> ${post.store} - ${post.location}
                        </div>
                        
                        ${post.car ? `<div class="font-bold text-white text-base mb-1">${post.car}</div>` : ''}
                        
                        <p class="text-slate-300 text-sm leading-relaxed">${post.desc}</p>
                    </div>
                </div>
                <div class="flex flex-wrap gap-4 items-center justify-between border-t border-slate-800 pt-3">
                    <div class="flex gap-4">
                        <a href="https://www.ebay.co.uk/sch/i.html?_nkw=${postSearchTerm}" target="_blank" class="bg-[#0064d2]/20 text-[#0064d2] border border-[#0064d2]/50 hover:bg-[#0064d2] hover:text-white px-3 py-1.5 rounded-lg text-[11px] uppercase font-bold tracking-wider flex items-center transition-all">
                            <i class="fab fa-ebay mr-1 text-base"></i> Check Value
                        </a>
                    </div>
                    ${!isRaided ? `
                    <button onclick="markEmpty('${post.id}')" class="text-red-400/80 hover:text-red-400 bg-red-950/30 border border-red-900/50 px-3 py-1.5 rounded-lg text-[11px] uppercase font-bold tracking-wider transition-all">
                        <i class="fas fa-ban mr-1"></i> Pegs Empty (${post.emptyVotes || 0})
                    </button>
                    ` : ''}
                </div>
            `;
            return div;
        }

        document.getElementById('filter-search').addEventListener('input', renderFeed);
        window.closeModal = (id) => document.getElementById(id).classList.add('hidden');
        
        document.getElementById('add-post-btn').addEventListener('click', () => {
            document.getElementById('post-form').reset();
            // Reset the custom store input if it was left open
            toggleCustomStore('');
            document.getElementById('post-modal').classList.remove('hidden');
        });

        document.getElementById('profile-btn').addEventListener('click', () => {
            document.getElementById('profile-username').value = profiles[currentUser] || '';
            document.getElementById('profile-modal').classList.remove('hidden');
        });

        document.getElementById('post-form').addEventListener('submit', (e) => {
            e.preventDefault();
            
            // Check if they selected a standard store or typed a custom one
            let finalStoreName = document.getElementById('post-store').value;
            if (finalStoreName === 'Somewhere Else') {
                finalStoreName = document.getElementById('custom-store-name').value.trim();
            }

            const newPost = {
                id: 'post_' + Date.now(),
                userId: currentUser,
                store: finalStoreName,
                location: document.getElementById('post-location').value.trim(),
                car: document.getElementById('post-car').value.trim(),
                desc: document.getElementById('post-desc').value.trim(),
                timestamp: Date.now(),
                emptyVotes: 0
            };
            allPosts.push(newPost);
            localStorage.setItem('radar_posts', JSON.stringify(allPosts));
            
            showNotification("Intel Broadcasted!");
            closeModal('post-modal');
            renderFeed();
        });

        document.getElementById('save-profile-btn').addEventListener('click', () => {
            const name = document.getElementById('profile-username').value.trim();
            if (name) {
                profiles[currentUser] = name;
                localStorage.setItem('profiles', JSON.stringify(profiles));
                document.getElementById('user-display-name').textContent = name;
                showNotification("Callsign updated!");
                closeModal('profile-modal');
                renderFeed();
            }
        });

        window.markEmpty = (postId) => {
            if(confirm("Confirm pegs are empty? This warns other hunters.")) {
                const post = allPosts.find(p => p.id === postId);
                if (post) {
                    post.emptyVotes = (post.emptyVotes || 0) + 1;
                    localStorage.setItem('radar_posts', JSON.stringify(allPosts));
                    showNotification(post.emptyVotes >= 3 ? "Post stamped as RAIDED!" : "Empty vote recorded.");
                    renderFeed();
                }
            }
        };

        function showNotification(msg) {
            const area = document.getElementById('notification-area');
            const notif = document.createElement('div');
            notif.className = `p-3 rounded-lg text-white shadow-lg text-xs font-oswald uppercase bg-green-700 border border-green-400`;
            notif.textContent = msg;
            area.appendChild(notif);
            setTimeout(() => { notif.remove(); }, 3000);
        }

        initApp();
    </script>
