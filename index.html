        document.getElementById('confirm-no').addEventListener('click', () => {

            confirmActionCallback = null;
        });
        document.getElementById('confirm-yes').addEventListener('click', () => {
            document.getElementById('confirm-modal').classList.add('hidden');
            if (confirmActionCallback) confirmActionCallback();
        });
        
        // Image Compression (Client-side)
        let currentCompressedImageBase64 = null;
        window.previewImage = (event) => {
            const file = event.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (e) => {
                const img = new Image();
                img.src = e.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 800; // Compress heavily to save db space
                    const MAX_HEIGHT = 800;
                    let width = img.width;
                    let height = img.height;

                    if (width > height && width > MAX_WIDTH) {
                        height *= MAX_WIDTH / width; width = MAX_WIDTH;
                    } else if (height > MAX_HEIGHT) {
                        width *= MAX_HEIGHT / height; height = MAX_HEIGHT;
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    // Convert to base64 jpeg
                    currentCompressedImageBase64 = canvas.toDataURL('image/jpeg', 0.6);
                    
                    const preview = document.getElementById('image-preview');
                    preview.src = currentCompressedImageBase64;
                    preview.classList.remove('hidden');
                    document.getElementById('image-remove-btn').classList.remove('hidden');
                };
            };
        };

        window.removeImage = () => {
            document.getElementById('post-image').value = '';
            document.getElementById('image-preview').classList.add('hidden');
            document.getElementById('image-remove-btn').classList.add('hidden');
            currentCompressedImageBase64 = null;
        };

        // Geocoding (Convert Town to GPS)
        async function getCoordinates(city) {
            try {
                const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(city + ', UK')}`);
                const data = await response.json();
                if (data && data.length > 0) {
                    return { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon) };
                }

            return null; // Fallback if town not found

        function initMap() {
            if (map) return;
            map = L.map('radar-map', { zoomControl: false }).setView([53.4808, -2.2426], 6); // Default center UK
            L.control.zoom({ position: 'bottomright' }).addTo(map);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
                subdomains: 'abcd',
                maxZoom: 19
            }).addTo(map);
        }

        window.switchTab = (tab) => {
            const feedBtn = document.getElementById('tab-feed');
            const mapBtn = document.getElementById('tab-map');
            const feedContainer = document.getElementById('feed-container');
            const mapContainer = document.getElementById('map-container');
            const filterSec = document.getElementById('filters-section');

            if (tab === 'feed') {
                feedBtn.className = "flex-1 py-2 text-sm font-bold uppercase tracking-wider rounded-lg bg-green-600 text-white shadow-[0_0_10px_rgba(34,197,94,0.3)] transition-all";
                mapBtn.className = "flex-1 py-2 text-sm font-bold uppercase tracking-wider rounded-lg text-slate-400 hover:text-white transition-all";
                feedContainer.classList.remove('hidden');
                filterSec.classList.remove('hidden');
                mapContainer.classList.add('hidden');
            } else {
                mapBtn.className = "flex-1 py-2 text-sm font-bold uppercase tracking-wider rounded-lg bg-green-600 text-white shadow-[0_0_10px_rgba(34,197,94,0.3)] transition-all";
                feedBtn.className = "flex-1 py-2 text-sm font-bold uppercase tracking-wider rounded-lg text-slate-400 hover:text-white transition-all";
                feedContainer.classList.add('hidden');
                filterSec.classList.add('hidden');
                mapContainer.classList.remove('hidden');
                
                initMap();
                setTimeout(() => map.invalidateSize(), 100);
                updateMapMarkers();
            }
        };

        // Auth Logic
        onAuthStateChanged(auth, (user) => {
            const authBtn = document.getElementById('auth-btn');
            const authText = document.getElementById('auth-text');
            const authIcon = document.getElementById('auth-icon');
            const userAvatar = document.getElementById('user-avatar');

            if (user) {
                currentUser = user;
                authText.textContent = user.displayName.split(' ')[0];
                authIcon.classList.add('hidden');
                userAvatar.src = user.photoURL;
                userAvatar.classList.remove('hidden');
            } else {
                currentUser = null;
                authText.textContent = "Sign In";
                authIcon.classList.remove('hidden');
                userAvatar.classList.add('hidden');
            }
        });

        const handleLogin = async () => {
            if (currentUser) {
                showConfirm("Sign Out", "Are you sure you want to disconnect?", async () => {
                    await signOut(auth);
                    showNotification("Disconnected from Radar.");
                });
            } else {
                try {
                    await signInWithPopup(auth, provider);
                    showNotification("Secure connection established.");
                } catch (error) { showNotification("Connection failed. Try again."); }
            }
        };
        document.getElementById('auth-btn').addEventListener('click', handleLogin);

        // Fetch Live Data (New Strict Path)
        if(db) {
            const postsColRef = collection(db, 'artifacts', safeAppId, 'public', 'data', 'posts');
            onSnapshot(postsColRef, (snapshot) => {
                allPosts = [];
                snapshot.forEach((doc) => {
                    allPosts.push({ id: doc.id, ...doc.data() });
                });
                // Sort in memory to avoid complex query rule breaking
                allPosts.sort((a, b) => b.timestamp - a.timestamp);
                
                renderFeed();
                if(!document.getElementById('map-container').classList.contains('hidden')) {
                    updateMapMarkers();
                }
            }, (error) => {
                console.error("Live sync error", error);
            });
        }

        // Post Form Submission
        document.getElementById('add-post-btn').addEventListener('click', () => {
            if (!currentUser) { showNotification("Authentication required to transmit."); return; }
            document.getElementById('post-form').reset();
            removeImage();
            toggleCustomStore('');
            document.getElementById('post-modal').classList.remove('hidden');
        });

        document.getElementById('post-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!currentUser) return;
            
            const submitBtn = document.getElementById('submit-btn');
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Transmitting...';
            submitBtn.disabled = true;

            let finalStoreName = document.getElementById('post-store').value;
            if (finalStoreName === 'Somewhere Else') finalStoreName = document.getElementById('custom-store-name').value.trim();
            const location = document.getElementById('post-location').value.trim();
            
            // Get GPS coordinates in background
            const coords = await getCoordinates(location);

            try {
                await addDoc(collection(db, 'artifacts', safeAppId, 'public', 'data', 'posts'), {
                    userId: currentUser.uid,
                    userName: currentUser.displayName,
                    userPhoto: currentUser.photoURL,
                    store: finalStoreName,
                    location: location,
                    coordinates: coords, // Save for map plotting!
                    car: document.getElementById('post-car').value.trim(),
                    desc: document.getElementById('post-desc').value.trim(),
                    image: currentCompressedImageBase64, // Save attached photo
                    timestamp: Date.now(),
                    emptyVotes: 0,
                    comments: [] // Init empty comments array
                });
                showNotification("Intel Broadcasted Successfully!");
                closeModal('post-modal');
            } catch (error) {
                console.error("Error adding post: ", error);
                showNotification("Error broadcasting intel.");
            } finally {
                submitBtn.innerHTML = '<span><i class="fas fa-broadcast-tower mr-2"></i> Transmit</span>';
                submitBtn.disabled = false;
            }
        });

        // UI Helpers
        window.closeModal = (id) => document.getElementById(id).classList.add('hidden');
        window.toggleCustomStore = (val) => {
            const customInput = document.getElementById('custom-store-name');
            if (val === 'Somewhere Else') { customInput.classList.remove('hidden'); customInput.required = true; } 
            else { customInput.classList.add('hidden'); customInput.required = false; customInput.value = ''; }
        };
        window.showNotification = (msg) => {
            const area = document.getElementById('notification-area');
            const notif = document.createElement('div');
            notif.className = `px-4 py-2.5 rounded-lg text-white shadow-lg text-xs font-bold font-oswald uppercase bg-green-700 border border-green-400 z-[100] animate-pulse`;
            notif.textContent = msg;
            area.appendChild(notif);
            setTimeout(() => { notif.remove(); }, 3500);
        }

        // Empty Pegs Voting
        window.markEmpty = (postId) => {
            if (!currentUser) { showNotification("Auth required to vote."); return; }
            showConfirm("Pegs Empty?", "Are you at the store confirming the stock is gone?", async () => {
                const post = allPosts.find(p => p.id === postId);
                if (post) {
                    try {
                        const postRef = doc(db, 'artifacts', safeAppId, 'public', 'data', 'posts', postId);
                        await updateDoc(postRef, { emptyVotes: (post.emptyVotes || 0) + 1 });
                        showNotification(post.emptyVotes + 1 >= 3 ? "Post stamped as RAIDED!" : "Empty vote recorded.");
                    } catch (error) { console.error("Vote error:", error); }
                }
            });
        };

        // Comments System
        window.openComments = (postId) => {
            activeCommentPostId = postId;
            renderComments();
            document.getElementById('comments-modal').classList.remove('hidden');
        };

        function renderComments() {
            const post = allPosts.find(p => p.id === activeCommentPostId);
            const list = document.getElementById('comments-list');
            list.innerHTML = '';
            
            if(!post || !post.comments || post.comments.length === 0) {
                list.innerHTML = '<div class="text-center text-slate-500 text-sm py-8"><i class="fas fa-ghost text-2xl mb-2"></i><br>No chatter yet. Start the comms.</div>';
                return;
            }

            post.comments.forEach(c => {
                const div = document.createElement('div');
                div.className = "flex gap-2.5";
                div.innerHTML = `
                    <img src="${c.photo || 'https://via.placeholder.com/30'}" class="w-7 h-7 rounded-full border border-slate-600">
                    <div class="bg-slate-800/80 p-2.5 rounded-lg rounded-tl-none border border-slate-700 flex-grow">
                        <div class="flex justify-between items-center mb-1">
                            <span class="text-xs font-bold text-slate-300">${c.name}</span>
                            <span class="text-[10px] text-slate-500">${new Date(c.time).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
                        </div>
                        <p class="text-sm text-slate-100">${c.text}</p>
                    </div>
                `;
                list.appendChild(div);
            });
            list.scrollTop = list.scrollHeight; // Auto scroll to bottom
        }

        document.getElementById('send-comment-btn').addEventListener('click', async () => {
            if (!currentUser) { showNotification("Auth required to chat."); return; }
            const input = document.getElementById('comment-input');
            const text = input.value.trim();
            if(!text || !activeCommentPostId) return;

            const post = allPosts.find(p => p.id === activeCommentPostId);
            if(post) {
                input.value = ''; // clear instantly
                const newComment = {
                    text: text,
                    name: currentUser.displayName.split(' ')[0],
                    photo: currentUser.photoURL,
                    time: Date.now()
                };
                try {
                    const postRef = doc(db, 'artifacts', safeAppId, 'public', 'data', 'posts', activeCommentPostId);
                    await updateDoc(postRef, { comments: [...(post.comments || []), newComment] });
                } catch(e) { console.error("Comment failed", e); showNotification("Failed to send intel."); }
            }
        });

        // Feed Rendering
        function renderFeed() {
            const container = document.getElementById('feed-container');
            const emptyState = document.getElementById('empty-state');
            container.innerHTML = ''; 
            
            const search = document.getElementById('filter-search').value.toLowerCase();
            let filtered = allPosts.filter(post => {
                if (search) return `${post.car || ''} ${post.desc} ${post.store} ${post.location} ${post.userName}`.toLowerCase().includes(search);
                return true;
            });

            if (filtered.length === 0) {
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');
                filtered.forEach(post => container.appendChild(createPostCard(post)));
            }
        }

        function createPostCard(post) {
            const timeAgo = Math.max(1, Math.floor((Date.now() - post.timestamp) / 60000));
            let timeString = `${timeAgo}m ago`;
            if (timeAgo > 60 && timeAgo < 1440) timeString = `${Math.floor(timeAgo/60)}h ago`;
            if (timeAgo >= 1440) timeString = `${Math.floor(timeAgo/1440)}d ago`;

            const isRaided = post.emptyVotes >= 3;
            const freshnessClass = isRaided ? 'post-raided relative' : 'post-fresh';
            
            // Scout Badge Logic (Calculated dynamically)
            const userPostCount = allPosts.filter(p => p.userId === post.userId).length;
            let badgeHtml = '';
            if (userPostCount >= 5) {
                badgeHtml = `<span class="bg-amber-500/20 text-amber-400 border border-amber-500/50 text-[9px] uppercase px-1.5 py-0.5 rounded ml-2 shadow-[0_0_5px_rgba(245,158,11,0.3)]" title="Elite Scout"><i class="fas fa-star"></i> Elite</span>`;
            }

            const div = document.createElement('div');
            div.className = `glass-card rounded-xl overflow-hidden shadow-md border-l-4 border-l-green-500 bg-slate-900/60 p-4 ${freshnessClass}`;
            
            div.innerHTML = `
                ${isRaided ? '<div class="raided-stamp">RAIDED</div>' : ''}
                <div class="flex gap-3 mb-3">
                    <img src="${post.userPhoto || 'https://via.placeholder.com/40'}" class="w-10 h-10 rounded-full border border-green-500/50 shrink-0 object-cover shadow-lg">
                    <div class="flex-grow">
                        <div class="flex justify-between items-center">
                            <div class="flex items-center">
                                <span class="font-bold text-white text-sm">${post.userName || 'Collector'}</span>
                                ${badgeHtml}
                            </div>
                            <span class="text-green-400/80 font-mono-price text-xs flex items-center"><i class="fas fa-clock mr-1 text-[10px]"></i> ${timeString}</span>
                        </div>
                        <div class="inline-flex items-center gap-1.5 bg-slate-950/60 text-slate-300 text-[10px] font-bold uppercase px-2.5 py-1 rounded border border-slate-700/50 mt-1.5 mb-2">
                            <i class="fas fa-map-marker-alt text-green-500"></i> ${post.store} - ${post.location}
                        </div>
                        ${post.car ? `<div class="font-bold text-white text-base mb-1">${post.car}</div>` : ''}
                        <p class="text-slate-300 text-sm leading-relaxed">${post.desc}</p>
                    </div>
                </div>
                
                ${post.image ? `
                <div class="mt-2 mb-3 rounded-lg overflow-hidden border border-slate-700/50 relative">
                    <img src="${post.image}" class="w-full h-48 object-cover hover:opacity-90 transition-opacity">
                </div>
                ` : ''}

                <div class="flex flex-wrap gap-2 items-center justify-between border-t border-slate-800 pt-3 mt-1">
                    <button onclick="openComments('${post.id}')" class="text-slate-300 bg-slate-800/80 hover:bg-slate-700 border border-slate-700 px-3 py-1.5 rounded-lg text-[11px] uppercase font-bold tracking-wider flex items-center transition-all">
                        <i class="fas fa-comment-dots mr-1.5"></i> Intel (${post.comments ? post.comments.length : 0})
                    </button>
                    ${!isRaided ? `
                    <button onclick="markEmpty('${post.id}')" class="text-red-400/90 hover:text-red-400 bg-red-950/30 border border-red-900/50 px-3 py-1.5 rounded-lg text-[11px] uppercase font-bold tracking-wider transition-all shadow-[0_0_10px_rgba(239,68,68,0.1)]">
                        <i class="fas fa-ban mr-1"></i> Pegs Empty (${post.emptyVotes || 0})
                    </button>` : ''}
                </div>
            `;
            return div;
        }

        document.getElementById('filter-search').addEventListener('input', () => {
            renderFeed();
            if(!document.getElementById('map-container').classList.contains('hidden')) updateMapMarkers();
        });

        // Map Plotting Logic
        function updateMapMarkers() {
            if(!map) return;
            // Clear old markers
            mapMarkers.forEach(m => map.removeLayer(m));
            mapMarkers = [];

            const search = document.getElementById('filter-search').value.toLowerCase();
            let hasFreshMarkers = false;
            let bounds = L.latLngBounds();

            allPosts.forEach(post => {
                if (search && !`${post.car || ''} ${post.desc} ${post.store} ${post.location}`.toLowerCase().includes(search)) return;
                if (!post.coordinates) return; // Skip if no GPS

                const isRaided = post.emptyVotes >= 3;
                const markerColor = isRaided ? '#ef4444' : '#22c55e'; // Red vs Green
                const className = isRaided ? '' : 'custom-radar-marker';
                
                const customIcon = L.divIcon({
                    className: className,
                    html: `<div style="background-color:${markerColor}; width:12px; height:12px; border-radius:50%; border:2px solid #000;"></div>`,
                    iconSize: [12, 12]
                });

                const popupHtml = `
                    <div class="p-1">
                        <div class="font-bold text-sm mb-1">${post.store}</div>
                        <div class="text-xs text-green-400 mb-1">${post.car}</div>
                        ${isRaided ? '<div class="text-red-500 font-bold text-xs uppercase mt-1">RAIDED</div>' : ''}
                    </div>
                `;

                const marker = L.marker([post.coordinates.lat, post.coordinates.lng], {icon: customIcon})
                    .bindPopup(popupHtml)
                    .addTo(map);
                
                mapMarkers.push(marker);
                bounds.extend([post.coordinates.lat, post.coordinates.lng]);
                hasFreshMarkers = true;
            });

            if(hasFreshMarkers) map.fitBounds(bounds, {padding: [50, 50], maxZoom: 12});
        }

    </script>
</body>
</html>
